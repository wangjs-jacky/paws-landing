<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Paws lets you control AI coding agents on your computer from anywhere."
    />
    <link rel="icon" href="/assets/mascots/hoodie.png" />
    <meta name="theme-color" content="#1d1713" />
    <title>Paws — Control your AI coding agents from anywhere</title>
    <script>
      (() => {
        let theme = null;
        try {
          const saved = window.localStorage.getItem('paws-home-theme-v1');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch {}
        if (!theme) {
          theme = window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <style>
      html { background: #1d1713; color: #fff7ed; }
      body { margin: 0; }
    </style>
  </head>
  <body>
    <noscript>Paws requires JavaScript. <a href="/docs">Read the documentation</a>.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
