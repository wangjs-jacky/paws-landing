name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "tests/**"
      - "scripts/**"
      - "e2e/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "playwright.config.js"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paws-landing-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production site
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: npm run check

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests against dist
        run: npm run test:e2e

      - name: Validate installer artifact
        shell: bash
        run: |
          if [[ ! -f dist/install.sh ]]; then
            echo "No installer artifact is present on this integration base; skipping installer validation."
            exit 0
          fi

          installer_mime="$(file --brief --mime-type dist/install.sh)"
          if [[ "$installer_mime" == "text/html" ]]; then
            echo "::error::dist/install.sh is HTML, not an installer."
            exit 1
          fi

          head -n 1 dist/install.sh | grep --quiet '^#!' || {
            echo "::error::dist/install.sh does not begin with a shebang."
            exit 1
          }

      - name: Check deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.105.0 pages deploy dist \
            --project-name paws-landing \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "GitHub Actions deployment" \
            --commit-dirty=false

      - name: Verify production site
        shell: bash
        run: |
          production_origin="https://paws-landing-eo4.pages.dev"

          verify_exact_artifact() {
            local label="$1"
            local url="$2"
            local local_file="$3"
            local response_file="$RUNNER_TEMP/paws-${label}.remote"

            for attempt in {1..12}; do
              if curl --fail --silent --show-error --location --max-time 20 \
                --output "$response_file" "$url"; then
                local remote_sha
                local local_sha
                remote_sha="$(sha256sum "$response_file" | awk '{print $1}')"
                local_sha="$(sha256sum "$local_file" | awk '{print $1}')"
                if [[ "$remote_sha" == "$local_sha" ]] && cmp --silent "$response_file" "$local_file"; then
                  echo "Verified exact $label artifact: $local_sha"
                  return 0
                fi
              fi

              echo "Waiting for exact $label artifact (attempt $attempt/12)"
              sleep 10
            done

            echo "::error::Exact artifact verification failed for $url"
            return 1
          }

          verify_page() {
            local url="$1"
            local expected="$2"
            local response_file="$RUNNER_TEMP/paws-page.html"

            for attempt in {1..12}; do
              if curl --fail --silent --show-error --location --max-time 20 \
                --output "$response_file" "$url" \
                && grep --fixed-strings --quiet "$expected" "$response_file"; then
                echo "Verified $url"
                return 0
              fi

              echo "Waiting for $url to update (attempt $attempt/12)"
              sleep 10
            done

            echo "::error::Production verification failed for $url"
            return 1
          }

          verify_installer() {
            local url="$1"
            local local_file="$2"
            local response_file="$RUNNER_TEMP/paws-install.remote"

            for attempt in {1..12}; do
              local content_type
              if content_type="$(curl --fail --silent --show-error --location --max-time 20 \
                --output "$response_file" --write-out '%{content_type}' "$url")"; then
                if [[ "$content_type" != text/html* ]] \
                  && head -n 1 "$response_file" | grep --quiet '^#!' \
                  && cmp --silent "$response_file" "$local_file"; then
                  echo "Verified production installer"
                  return 0
                fi
              fi

              echo "Waiting for production installer (attempt $attempt/12)"
              sleep 10
            done

            echo "::error::Production installer verification failed for $url"
            return 1
          }

          verify_exact_artifact "homepage" "${production_origin}/" "dist/index.html"
          verify_exact_artifact "hero-atlas" "${production_origin}/assets/mascot-turn-atlas.webp" \
            "dist/assets/mascot-turn-atlas.webp"
          verify_page "${production_origin}/docs" "Pair your Paws account"
          verify_page "${production_origin}/docs/zh-CN" "安装与快速上手"
          if [[ -f dist/install.sh ]]; then
            verify_installer "${production_origin}/install.sh" "dist/install.sh"
          else
            echo "No installer artifact is present on this integration base; skipping production installer verification."
          fi
