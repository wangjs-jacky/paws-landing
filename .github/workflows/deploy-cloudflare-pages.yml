name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "tests/**"
      - "scripts/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paws-landing-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: npm run check

      - name: Check deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.105.0 pages deploy dist \
            --project-name paws-landing \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "GitHub Actions deployment" \
            --commit-dirty=false

      - name: Verify production site
        shell: bash
        run: |
          verify_page() {
            local url="$1"
            local expected="$2"
            local response_file="$RUNNER_TEMP/paws-page.html"

            for attempt in {1..12}; do
              if curl --fail --silent --show-error --location --max-time 20 \
                --output "$response_file" "$url" \
                && grep --fixed-strings --quiet "$expected" "$response_file"; then
                echo "Verified $url"
                return 0
              fi

              echo "Waiting for $url to update (attempt $attempt/12)"
              sleep 10
            done

            echo "::error::Production verification failed for $url"
            return 1
          }

          verify_page "https://paws-landing-eo4.pages.dev/" "Paws — Control your AI coding agents from anywhere"
          verify_page "https://paws-landing-eo4.pages.dev/docs" "Pair your Paws account"
          verify_page "https://paws-landing-eo4.pages.dev/docs/zh-CN" "安装与快速上手"
